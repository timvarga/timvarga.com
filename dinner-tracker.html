<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dinner Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#2d4a35; --green-light:#3d5f45; --cream:#faf7f0; --brown:#8a4a1a;
    --bg:#f2ede4; --card:#ffffff; --border:#e2ddd4; --text:#1c1c1e; --muted:#78736a;
    --urgent:#b3441f; --soon:#c4882a; --fine:#3b7a4a;
    --saffron:#c4882a;
    --serif:'Fraunces',Georgia,serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --shadow:0 1px 3px rgba(44,35,20,.05),0 4px 14px rgba(44,35,20,.07);
    --shadow-hover:0 2px 6px rgba(44,35,20,.08),0 8px 24px rgba(44,35,20,.12);
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
  header{background:var(--green);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  header h1{font-size:19px;margin:0;font-weight:600;font-family:var(--serif);letter-spacing:.01em;}
  header .sub{font-size:11px;opacity:.6;margin-top:2px;letter-spacing:.03em;}
  .iobtns{display:flex;gap:7px;}
  .iobtns button{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:7px 13px;font-size:12px;cursor:pointer;font-family:var(--sans);font-weight:500;transition:background .15s;}
  .iobtns button:hover{background:rgba(255,255,255,.2);}
  nav{display:flex;background:var(--green-light);overflow-x:auto;gap:0;}
  nav button{flex:1;min-width:80px;background:none;border:none;color:rgba(255,255,255,.65);padding:10px 6px;font-size:11.5px;cursor:pointer;border-bottom:2.5px solid transparent;white-space:normal;text-align:center;line-height:1.35;font-family:var(--sans);font-weight:500;transition:color .15s;}
  nav button.active{color:#fff;border-bottom-color:#e8c468;font-weight:600;}
  nav button:hover:not(.active){color:rgba(255,255,255,.9);}
  main{max-width:960px;margin:0 auto;padding:20px 16px 80px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);transition:box-shadow .2s ease;position:relative;}
  .card:hover{box-shadow:var(--shadow-hover);z-index:1;}
  /* Cuisine accent — colored left border on meal cards */
  .meal-card{border-left:4px solid var(--border);padding-left:16px;}
  .meal-card[data-cuisine="Mediterranean"]{border-left-color:#c4882a;}
  .meal-card[data-cuisine="Middle Eastern"]{border-left-color:#b87038;}
  .meal-card[data-cuisine="Asian"],.meal-card[data-cuisine="Pan-Asian"]{border-left-color:#4a7a8a;}
  .meal-card[data-cuisine="Japanese"]{border-left-color:#5a6a9a;}
  .meal-card[data-cuisine="Korean"]{border-left-color:#7a4a8a;}
  .meal-card[data-cuisine="Thai"],.meal-card[data-cuisine="Southeast Asian"]{border-left-color:#6a8a3a;}
  .meal-card[data-cuisine="Indian"]{border-left-color:#c47028;}
  .meal-card[data-cuisine="Mexican"],.meal-card[data-cuisine="Tex-Mex"]{border-left-color:#a83828;}
  .meal-card[data-cuisine="American"]{border-left-color:#4a6a5a;}
  .meal-card[data-cuisine="Global"],.meal-card[data-cuisine="Fusion"]{border-left-color:#6a5a8a;}
  .panel-title{font-size:16px;font-weight:600;color:var(--green);margin:4px 0 14px;font-family:var(--serif);}
  .meal-row{display:flex;gap:14px;align-items:flex-start;}
  .meal-date{min-width:48px;text-align:center;padding-top:2px;}
  .meal-date .d{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:600;}
  .meal-date .n{font-size:36px;font-weight:300;color:var(--green);font-family:var(--serif);line-height:1;letter-spacing:-1.5px;}
  .meal-body{flex:1;min-width:0;}
  .meal-title{font-weight:600;font-size:16px;color:var(--text);font-family:var(--serif);line-height:1.25;}
  .badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;margin-left:7px;vertical-align:middle;letter-spacing:.03em;}
  .badge.urgent{background:#fbe3da;color:#922210;}
  .badge.soon{background:#fdf0d8;color:#8a5510;}
  .badge.fine{background:#dff0e2;color:#235a30;}
  .badge.cooked{background:#eaeae2;color:#6a6a58;}
  .meal-meta{font-size:11.5px;color:var(--muted);margin-top:4px;letter-spacing:.01em;}
  .meal-note{font-size:12.5px;color:var(--brown);margin-top:6px;background:#fdf5ec;border-radius:8px;padding:7px 11px;border-left:3px solid #e8c888;}
  .row-actions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap;}
  .row-actions button{font-size:12px;border:1px solid var(--border);background:var(--card);border-radius:7px;padding:6px 13px;cursor:pointer;font-weight:500;font-family:var(--sans);transition:all .15s;color:var(--text);}
  .row-actions button.primary{background:var(--green);color:#fff;border-color:var(--green);}
  .row-actions button:hover:not(.primary){background:var(--cream);border-color:var(--green);color:var(--green);}
  .row-actions button.primary:hover{background:var(--green-light);}
  details{margin-top:10px;}
  details[open] summary{color:var(--green);}
  summary{cursor:pointer;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;user-select:none;transition:color .15s;list-style:none;display:flex;align-items:center;gap:5px;}
  summary::-webkit-details-marker{display:none;}
  summary::before{content:'›';font-size:14px;transition:transform .2s;display:inline-block;}
  details[open] summary::before{transform:rotate(90deg);}
  .ing-list{margin:6px 0 4px;border:0.5px solid var(--border);border-radius:8px;overflow:hidden;font-size:13px;}
  .ing-b-row{position:relative;overflow:hidden;border-bottom:0.5px solid var(--border);}
  .ing-b-row:last-of-type{border-bottom:none;}
  .ing-b-rm{position:absolute;right:0;top:0;height:100%;display:flex;align-items:stretch;z-index:0;}
  .ing-b-rm button{background:#b3441f;color:#fff;border:none;padding:0 18px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
  .ing-b-inner{display:flex;align-items:center;gap:9px;padding:7px 12px;background:var(--card);position:relative;z-index:1;transition:transform .2s ease;}
  .ing-b-row.swiped .ing-b-inner{transform:translateX(-80px);}
  .ing-b-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--border);}
  .ing-b-dot.type-protein{background:#b3441f;}.ing-b-dot.type-vegetable{background:#3b7a4a;}.ing-b-dot.type-fruit{background:#c47a2b;}.ing-b-dot.type-legume{background:#7a5c17;}.ing-b-dot.type-grain{background:#8a7340;}.ing-b-dot.type-condiment{background:#9a9a8a;}.ing-b-dot.type-fermented{background:#6b4a7a;}
  .ing-b-name{font-size:13px;color:var(--text);flex:1;min-width:0;}
  .ing-b-name[data-rid]{cursor:pointer;}
  .ing-b-name[data-rid]:hover{color:var(--green);}
  .ing-b-qty{font-size:12px;color:var(--muted);white-space:nowrap;flex-shrink:0;}
  .ing-b-x{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);background:var(--bg);color:var(--muted);font-size:15px;line-height:22px;text-align:center;cursor:pointer;flex-shrink:0;opacity:0;transition:opacity .15s;padding:0;font-family:inherit;}
  .ing-b-row:hover .ing-b-x{opacity:1;}
  .ing-add-bar{border-top:0.5px solid var(--border);}
  .ing-add-bar button{width:100%;background:none;border:none;padding:8px 14px;font-size:12.5px;color:var(--green);font-weight:600;cursor:pointer;text-align:left;font-family:inherit;}
  .ing-add-bar button:hover{background:var(--cream);}
  .ing-add-form{padding:10px 12px;background:var(--cream);display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .ing-add-form input,.ing-add-form select{font-size:12px;border:1px solid var(--border);border-radius:6px;padding:5px 8px;background:#fff;color:var(--text);font-family:inherit;}
  .ing-add-form .add-name-in{flex:1;min-width:120px;}.ing-add-form .add-qty-in{width:80px;}
  .btn-sm-green{background:var(--green);color:#fff;border:none;border-radius:6px;font-size:12px;padding:5px 11px;cursor:pointer;font-family:inherit;font-weight:600;}
  .btn-sm-muted{background:none;border:none;color:var(--muted);font-size:12px;padding:5px 8px;cursor:pointer;font-family:inherit;}
  .step-row{display:flex;align-items:flex-start;gap:6px;padding-right:4px;}
  .step-row:hover .step-rm-x{opacity:1;}
  .step-rm-x{flex-shrink:0;margin-top:1px;}
  .steps{margin:8px 0 0;padding-left:18px;font-size:13px;}
  .steps li{margin-bottom:5px;line-height:1.4;}
  .tag{display:inline-block;font-size:10px;background:var(--cream);color:var(--green);border-radius:5px;padding:3px 8px;margin:0 4px 5px 0;font-weight:500;letter-spacing:.02em;border:1px solid var(--border);}
  input[type=text],input[type=date],input[type=number],select,textarea{font-size:13px;padding:7px 9px;border:1px solid var(--border);border-radius:6px;width:100%;font-family:inherit;}
  label{font-size:12px;color:var(--muted);display:block;margin:8px 0 3px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .recipe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
  .recipe-card h3{font-size:16px;margin:0 0 5px;color:var(--green);font-family:var(--serif);font-weight:600;line-height:1.2;}
  .search-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .search-bar input{flex:1;min-width:160px;}
  .pill-toggle{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;margin-bottom:10px;}
  .pill-toggle button{border:none;background:#fff;padding:6px 12px;font-size:12px;cursor:pointer;}
  .pill-toggle button.active{background:var(--green);color:#fff;}
  .ing-chip-grid{display:flex;flex-wrap:wrap;gap:6px;max-height:230px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:8px;margin-top:6px;}
  .ing-chip{font-size:12px;padding:4px 9px;border-radius:20px;border:1px solid var(--border);background:#fff;cursor:pointer;user-select:none;}
  .ing-chip.on{background:var(--green);color:#fff;border-color:var(--green);}
  .match-bar{height:6px;border-radius:4px;background:var(--cream);overflow:hidden;margin-top:6px;}
  .match-fill{height:100%;background:var(--fine);}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:30px 10px;}
  .footer-note{font-size:11px;color:var(--muted);text-align:center;margin-top:28px;opacity:.7;letter-spacing:.03em;}
  .save-banner{background:var(--cream);border:1px solid var(--border);border-radius:10px;padding:10px 16px;font-size:12px;margin-bottom:18px;color:var(--muted);}
  textarea{min-height:50px;resize:vertical;}

  /* ---- Calendar view ---- */
  .view-toggle{display:flex;gap:6px;align-items:center;}
  .view-toggle button{font-size:12px;padding:5px 11px;border:1px solid var(--border);border-radius:6px;cursor:pointer;background:#fff;color:var(--muted);}
  .view-toggle button.active{background:var(--green);color:#fff;border-color:var(--green);}
  .tab-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .tab-header .panel-title{margin:0;}
  .cal-wrap{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px;}
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-nav-title{font-size:14px;font-weight:700;color:var(--green);}
  .cal-nav button{border:1px solid var(--border);border-radius:6px;padding:4px 12px;cursor:pointer;background:#fff;font-size:16px;line-height:1;color:var(--text);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal-hdr{font-size:10px;font-weight:600;color:var(--muted);text-align:center;padding:3px 0 5px;text-transform:uppercase;letter-spacing:.04em;}
  .cal-cell{min-height:60px;border:1px solid var(--border);border-radius:5px;padding:4px 3px;background:#fff;vertical-align:top;}
  .cal-cell.other-month{background:var(--bg);opacity:.5;}
  .cal-cell.today{border:2px solid var(--green);}
  .cal-cell.has-planned{background:#fdf8f0;}
  .cal-cell.has-cooked{background:#e8f5ec;}
  .cal-cell.has-skipped{background:#f3f3ec;}
  .cal-num{font-size:10.5px;font-weight:700;color:var(--muted);display:block;}
  .cal-num.today-num{color:var(--green);}
  .cal-meal{font-size:9.5px;color:var(--text);line-height:1.35;margin-top:2px;display:block;word-break:break-word;}
  .cal-meal.cooked{color:var(--fine);}
  .cal-meal.skipped{color:var(--muted);text-decoration:line-through;}

  /* ---- Login gate ---- */
  #authGate{position:fixed;inset:0;background:var(--green);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px;}
  #authGate .gate-box{background:#fff;border-radius:16px;padding:32px 28px;max-width:320px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  #authGate h2{margin:0 0 5px;color:var(--green);font-size:22px;font-family:var(--serif);font-weight:600;}
  #authGate p{margin:0 0 20px;color:var(--muted);font-size:13px;}
  #authGate input{text-align:center;font-size:15px;margin-bottom:10px;}
  #authGate button{width:100%;background:var(--green);color:#fff;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--sans);transition:background .15s;}
  #authGate button:hover{background:var(--green-light);}
  #authGate .gate-error{color:var(--urgent);font-size:12.5px;min-height:18px;margin-top:8px;}
  .signout-btn{background:rgba(255,255,255,.12)!important;}
  /* Ingredient substitution popup */
  #ing-sub-popup{position:fixed;background:#fff;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.22),0 1px 4px rgba(0,0,0,.1);padding:7px 5px;z-index:9998;min-width:180px;max-width:270px;display:none;}
  #ing-sub-popup.visible{display:block;animation:sub-pop-in .15s ease;}
  @keyframes sub-pop-in{from{opacity:0;transform:scale(.9) translateY(4px)}to{opacity:1;transform:scale(1) translateY(0)}}
  .sub-popup-label{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 10px 6px;}
  .sub-opt{display:block;width:100%;text-align:left;background:none;border:none;border-radius:9px;padding:8px 12px;font-size:13px;cursor:pointer;color:var(--text);font-family:inherit;}
  .sub-opt:hover,.sub-opt:active{background:var(--green);color:#fff;}
  .sub-opt.cancel{color:var(--muted);font-size:12px;}
  /* Scrubable numbers */
  .scrub-num{display:inline-block;color:var(--green);font-weight:600;font-family:var(--serif);border-bottom:1.5px dashed var(--green);cursor:ew-resize;padding:0 2px;user-select:none;-webkit-user-select:none;border-radius:3px;transition:background .1s;}
  .scrub-num:hover,.scrub-num.scrub-active{background:#e4f0e8;}
  /* Drag-to-reschedule */
  .meal-date{cursor:pointer;user-select:none;-webkit-user-select:none;}
  .drag-handle{display:block;font-size:11px;letter-spacing:1.5px;color:var(--muted);opacity:0;transition:opacity .15s;margin-bottom:5px;line-height:1;}
  .meal-card:hover .drag-handle,.meal-card.move-selected .drag-handle{opacity:.55;}
  .meal-card.dragging{opacity:.25;box-shadow:none !important;outline:none !important;}
  .meal-card.move-selected{outline:2px solid var(--saffron);outline-offset:3px;}
  .cal-meal[draggable]{cursor:grab;}
  .cal-cell.drop-over{background:#e4f0e8 !important;outline:2px dashed var(--green);outline-offset:-3px;}
  #drag-strip{position:fixed;bottom:0;left:0;right:0;background:var(--green);z-index:9997;display:none;padding:6px 0 env(safe-area-inset-bottom,10px);box-shadow:0 -4px 24px rgba(0,0,0,.25);}
  #drag-strip-label{font-size:9.5px;color:rgba(255,255,255,.5);text-align:center;letter-spacing:.08em;font-weight:600;text-transform:uppercase;padding-bottom:7px;display:flex;align-items:center;justify-content:center;gap:12px;}
  #drag-strip-label button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:5px;color:rgba(255,255,255,.75);font-size:9.5px;padding:3px 10px;cursor:pointer;font-family:var(--sans);}
  #drag-strip-inner{display:flex;overflow-x:auto;gap:3px;padding:0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  #drag-strip-inner::-webkit-scrollbar{display:none;}
  .strip-cell{flex-shrink:0;width:48px;text-align:center;border-radius:8px;padding:6px 2px;cursor:pointer;color:rgba(255,255,255,.65);transition:all .1s;border:1.5px solid transparent;}
  .strip-cell:hover,.strip-cell.drop-over{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.35);}
  .strip-cell.strip-today{border-color:rgba(255,255,255,.3);color:rgba(255,255,255,.9);}
  .strip-cell.strip-occupied::after{content:'•';display:block;font-size:10px;line-height:.8;color:rgba(255,255,255,.3);}
  .strip-cell .sd{font-size:8.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;display:block;}
  .strip-cell .sn{font-size:19px;font-weight:300;font-family:var(--serif);display:block;line-height:1.15;}
  .strip-cell .sm{font-size:8px;opacity:.45;display:block;}
  /* Grocery grid */
  .gl-toggles{display:flex;gap:6px;align-items:center;}
  .gl-toggle{font-size:11.5px;padding:5px 11px;border:1px solid var(--border);border-radius:6px;cursor:pointer;background:#fff;color:var(--muted);}
  .gl-toggle.active{background:var(--green);color:#fff;border-color:var(--green);}
  .grocery-grid-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:10px;margin-bottom:12px;}
  .grocery-grid{width:100%;border-collapse:collapse;font-size:12.5px;}
  .grocery-grid thead th{background:var(--green);color:#fff;padding:7px 5px;text-align:center;font-size:11px;font-weight:600;line-height:1.4;white-space:nowrap;}
  .grocery-grid thead th.gl-ing-hdr{text-align:left;padding-left:10px;min-width:130px;position:sticky;left:0;z-index:2;}
  .grocery-grid thead th.date-hdr{min-width:40px;}
  .grocery-grid tbody td{border:1px solid #ebebdf;padding:5px 4px;text-align:center;vertical-align:middle;}
  .grocery-grid tbody .gl-ing-cell{text-align:left;padding:6px 8px;white-space:nowrap;position:sticky;left:0;background:#fff;z-index:1;font-size:12.5px;border-right:2px solid var(--border);}
  .grocery-grid .gl-row{cursor:pointer;}
  .grocery-grid .gl-row:hover .gl-ing-cell,.grocery-grid .gl-row:hover td{background:#f0f7f1;}
  .grocery-grid .gl-type-sep td{background:var(--cream);font-weight:700;font-size:10px;color:var(--muted);padding:4px 10px;text-transform:uppercase;letter-spacing:.06em;}
  .gl-dot{display:block;width:12px;height:12px;border-radius:50%;margin:0 auto;}
  .frozen-tag{font-size:9px;margin-left:3px;opacity:.75;}
  /* Undo toast */
  #undo-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1b3a2b;color:#fff;border-radius:10px;padding:11px 16px;display:flex;align-items:center;gap:12px;font-size:13.5px;box-shadow:0 4px 18px rgba(0,0,0,.22);transition:transform .25s ease,opacity .25s ease;opacity:0;pointer-events:none;z-index:9999;white-space:nowrap;}
  #undo-toast.visible{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto;}
  #undo-toast button{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;}
  #undo-toast button:hover{background:rgba(255,255,255,.32);}
</style>
</head>
<body>

<div id="authGate">
  <div class="gate-box">
    <h2>🍽 Dinner Tracker</h2>
    <p>Sign in to continue.</p>
    <form id="gateForm" autocomplete="on">
      <input type="email" id="gateEmail" placeholder="Email" autocomplete="username">
      <input type="password" id="gatePw" placeholder="Password" autocomplete="current-password">
      <button type="submit">Sign In</button>
      <div class="gate-error" id="gateError"></div>
    </form>
  </div>
</div>

<div id="appContent" style="display:none">

<header>
  <div>
    <h1>🍽 Dinner Tracker</h1>
    <div class="sub" id="userSub">Wheat-free · dairy-free · pescatarian meal database</div>
  </div>
  <div class="iobtns">

/* =========================================================
   QUANTITY HELPERS
   ========================================================= */
const QTY_FRACS = {'½':0.5,'⅓':1/3,'⅔':2/3,'¼':0.25,'¾':0.75,'⅛':0.125,'⅜':0.375,'⅝':0.625,'⅞':0.875};
const QTY_FRAC_DISP = [[1/8,'⅛'],[1/4,'¼'],[1/3,'⅓'],[3/8,'⅜'],[1/2,'½'],[5/8,'⅝'],[2/3,'⅔'],[3/4,'¾'],[7/8,'⅞']];
function parseQty(str){
  if(!str) return {num:null,unit:''};
  const s = str.trim();
  let m = s.match(/^(\d+)([½⅓⅔¼¾⅛⅜⅝⅞])?(.*)/);
  if(m && (m[1]||m[2])){
    const whole = m[1] ? parseInt(m[1]) : 0;
    const frac  = m[2] ? (QTY_FRACS[m[2]]||0) : 0;
    const rest  = m[3]||'';
    if(rest.startsWith('–')) return {num:null,unit:s}; // range like "1–2 tbsp"
    return {num:whole+frac, unit:rest};
  }
  m = s.match(/^([½⅓⅔¼¾⅛⅜⅝⅞])(.*)/);
  if(m) return {num:QTY_FRACS[m[1]]||0, unit:m[2]||''};
  return {num:null, unit:s};
}
function fmtQty(num, unit){
  if(num===null||num===undefined) return unit||'';
  if(num<=0) return '0'+unit;
  const whole = Math.floor(num+0.04);
  const frac  = num - whole;
  let fs = '';
  for(const [v,s] of QTY_FRAC_DISP){ if(Math.abs(frac-v)<0.07){fs=s;break;} }
  if(!fs && Math.abs(frac)>0.07) return parseFloat(num.toFixed(1))+unit;
  return (whole>0?String(whole):'')+fs+unit;
}

/* =========================================================

   ========================================================= */
let saveTimer = null;
function queueSave(){
  if (!window.__fb) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    window.__fb.saveState(state).catch(err => console.error("Cloud save failed:", err));
  }, 500);
}

function recipeById(id){ return state.recipes.find(r => r.id === id); }
function fmtDate(iso){
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-US",{weekday:"short", month:"short", day:"numeric"});
}
function daysFromToday(iso){
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(iso + "T00:00:00");
  return Math.round((d - today) / 86400000);
}
function urgencyBadge(diff){
  if (diff <= 0) return '<span class="badge urgent">Today</span>';
  if (diff === 1) return '<span class="badge soon">Tomorrow</span>';
  if (diff <= 3) return '<span class="badge soon">In '+diff+' days</span>';
  return '<span class="badge fine">In '+diff+' days</span>';
}

/* =========================================================

   ========================================================= */
function renderUpcoming(){
  const entries = state.log.filter(l => l.status !== "cooked" && l.status !== "skipped")
    .sort((a,b) => a.date.localeCompare(b.date));
  const cookedRecently = state.log.filter(l => l.status === "cooked")
    .sort((a,b) => b.date.localeCompare(a.date)).slice(0,2);

  let html = `<div class="tab-header"><div class="panel-title">Tonight & Upcoming</div>${viewToggleHTML()}</div>`;
  if (calViewOn) return html + renderCalendar();
  if (entries.length === 0){
    html += `<div class="empty">Nothing scheduled. Add a recipe to your plan from the Recipe Library.</div>`;
  } else {
    entries.forEach(l => {
      const r = recipeById(l.recipeId);
      if (!r) return;
      const diff = daysFromToday(l.date);
      html += renderMealCard(l, r, diff);
    });
  }

  if (cookedRecently.length){
    html += `<div class="panel-title" style="margin-top:18px;">Recently cooked</div>`;
    cookedRecently.forEach(l => {
      const r = recipeById(l.recipeId);
      if (!r) return;
      html += renderMealCard(l, r, null);
    });
  }
  return html;
}

function renderMealCard(l, r, diff){
  const d = new Date(l.date + "T00:00:00");
  const dayName = d.toLocaleDateString("en-US",{weekday:"short"});
  const dayNum = d.getDate();
  let badge = "";
  if (l.status === "cooked") badge = '<span class="badge cooked">Cooked</span>';
  else if (diff !== null) badge = urgencyBadge(diff);

  return `<div class="card meal-card" id="mc-${l.id}" data-cuisine="${r.cuisine}">
    <div class="meal-row">
      <div class="meal-date" onclick="enterMoveMode('${l.id}')" title="Click or drag to reschedule">
        <span class="drag-handle" draggable="true"
          ondragstart="event.stopPropagation();dragStart(event,'${l.id}')"
          ondragend="event.stopPropagation();dragEnd(event)"
          onclick="event.stopPropagation()">⠿⠿</span>
        <div class="d">${dayName}</div><div class="n">${dayNum}</div>
      </div>
      <div class="meal-body">
        <div class="meal-title">${r.title}${badge}</div>
        <div class="meal-meta">Serves <span class="scrub-num" data-scrub="headcount" data-lid="${l.id}" data-rid="${r.id}">${l.headcount}</span> · ${r.cuisine} · ${r.method} · ~${r.totalMin} min total</div>
        ${l.note ? `<div class="meal-note">${l.note}</div>` : ""}
        <details id="det-${l.id}">
          <summary>Ingredients & steps</summary>
          ${renderIngredientsAndSteps(r, l.headcount)}
        </details>
        <div class="row-actions">
          ${l.status !== "cooked" ? `<button class="primary" onclick="markCooked('${l.id}')">Mark cooked</button>` : ""}
          ${l.status !== "skipped" && l.status !== "cooked" ? `<button onclick="markSkipped('${l.id}')">Skip / push back</button>` : ""}
          <button onclick="editNote('${l.id}')">Edit note</button>
        </div>
      </div>
    </div>
  </div>`;
}

function renderIngredientsAndSteps(r, displayServings){
  const baseServings = r.servings || 2;
  const scale = (displayServings && displayServings !== baseServings) ? displayServings / baseServings : 1;
  const ingRows = r.ingredients.map((i, idx) => {
    const hasSubs = !!SUBSTITUTIONS[i.name.toLowerCase().trim()];
    const subAttr = hasSubs ? ` data-rid="${r.id}" data-idx="${idx}" title="Hold/hover to swap"` : '';
    const frozen  = i.frozen ? ` <span class="frozen-tag">❄</span>` : '';
    const {num, unit} = parseQty(i.qty);
    const dispQty = num !== null ? fmtQty(num * scale, unit) : i.qty;
    return `<div class="ing-b-row">
      <div class="ing-b-rm"><button onclick="removeIngredient('${r.id}',${idx})">Remove</button></div>
      <div class="ing-b-inner">
        <span class="ing-b-dot type-${i.type||'other'}"></span>
        <span class="ing-b-name"${subAttr}>${i.name}${frozen}</span>
        <span class="ing-b-qty" data-qty-rid="${r.id}" data-qty-idx="${idx}"> – ${dispQty}</span>
        <button class="ing-b-x" onclick="removeIngredient('${r.id}',${idx})" aria-label="remove">×</button>
      </div>
    </div>`;
  }).join('');
  const steps = r.steps.map((s, si) => `<li class="step-row">
    <span class="step-text">${s}</span>
    <button class="ing-b-x step-rm-x" onclick="removeStep('${r.id}',${si})" aria-label="remove step">×</button>
  </li>`).join('');
  const typeOpts = ["protein","vegetable","fruit","legume","grain","condiment","fermented","other"]
    .map(t=>`<option value="${t}">${TYPE_LABELS[t]||t}</option>`).join('');
  return `<div class="ing-list">
    ${ingRows}
    <div id="add-ing-btn-${r.id}" class="ing-add-bar">
      <button onclick="showAddIngForm('${r.id}')">+ Add ingredient</button>
    </div>
    <div id="add-ing-form-${r.id}" class="ing-add-form" style="display:none">
      <input id="add-name-${r.id}" class="add-name-in" placeholder="Ingredient name"
             onkeydown="if(event.key==='Enter')addIngredient('${r.id}')">
      <input id="add-qty-${r.id}"  class="add-qty-in"  placeholder="Qty">
      <select id="add-type-${r.id}">${typeOpts}</select>
      <button class="btn-sm-green" onclick="addIngredient('${r.id}')">Add</button>
      <button class="btn-sm-muted" onclick="hideAddIngForm('${r.id}')">Cancel</button>
    </div>
  </div>
  <ol class="steps">${steps}</ol>
  <div id="add-step-btn-${r.id}" class="ing-add-bar" style="border-top:0.5px solid var(--border);border-radius:0 0 8px 8px;margin-top:4px;">
    <button onclick="showAddStepForm('${r.id}')">+ Add step</button>
  </div>

      style="font-size:12.5px;border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-family:inherit;resize:vertical;width:100%;box-sizing:border-box;background:#fff;color:var(--text);"></textarea>

function showUndoToast(label){
  if (undoTimer) clearTimeout(undoTimer);
  const t = document.getElementById("undo-toast");
  if (t){ t.querySelector(".toast-label").textContent = label; t.classList.add("visible"); }
  undoTimer = setTimeout(dismissUndoToast, 5000);
}
function dismissUndoToast(){
  const t = document.getElementById("undo-toast");
  if (t) t.classList.remove("visible");
  lastAction = null;
  undoTimer = null;
}
function undoLast(){
  if (!lastAction) return;
  const l = state.log.find(x => x.id === lastAction.logId);
  if (l){ l.status = lastAction.previousStatus; render(); queueSave(); }
  dismissUndoToast();
}
function showSubPopup(li, touch){
  const rid = li.dataset.rid;
  const idx = parseInt(li.dataset.idx);
  const r = state.recipes.find(x => x.id === rid);
  if (!r) return;
  const ing = r.ingredients[idx];
  if (!ing) return;
  const alts = SUBSTITUTIONS[ing.name.toLowerCase().trim()];
  if (!alts || !alts.length) return;
  const popup = document.getElementById("ing-sub-popup");
  if (!popup) return;
  popup.innerHTML = `<div class="sub-popup-label">Swap for…</div>` +
    alts.map(a => {
      const safe = a.replace(/\\/g,"\\\\").replace(/'/g,"\\'");
      return `<button class="sub-opt" onclick="swapIngredient('${rid}',${idx},'${safe}');hideSubPopup()">${a}</button>`;
    }).join("") +
    `<button class="sub-opt cancel" onclick="hideSubPopup()">✕ Cancel</button>`;
  popup.classList.add("visible");
  const pw = popup.offsetWidth, ph = popup.offsetHeight;
  let left, top;
  if (touch){
    left = touch.clientX - pw/2;
    top = touch.clientY - ph - 14;
  } else {
    const rect = li.getBoundingClientRect();
    left = rect.left;
    top = rect.top - ph - 8;
    if (top < 8) top = rect.bottom + 8;
  }
  left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
  top = Math.max(8, top);
  popup.style.left = left + "px";
  popup.style.top = top + "px";
}
function hideSubPopup(){
  const p = document.getElementById("ing-sub-popup");
  if (p) p.classList.remove("visible");
}
function swapIngredient(rid, idx, newName){
  const r = state.recipes.find(x => x.id === rid);
  if (!r || !r.ingredients[idx]) return;
  r.ingredients[idx] = {...r.ingredients[idx], name: newName};
  render();
  queueSave();
}
function removeIngredient(rid, idx){
  const r = state.recipes.find(x => x.id === rid);
  if (!r) return;
  r.ingredients.splice(idx, 1);
  render();
  queueSave();
}
function addIngredient(rid){
  const nameEl = document.getElementById('add-name-'+rid);
  const qtyEl  = document.getElementById('add-qty-'+rid);
  const typeEl = document.getElementById('add-type-'+rid);
  const name = nameEl ? nameEl.value.trim() : '';
  if (!name) { if (nameEl) nameEl.focus(); return; }
  const qty  = qtyEl  ? qtyEl.value.trim()  : '';
  const type = typeEl ? typeEl.value         : 'other';
  const r = state.recipes.find(x => x.id === rid);
  if (!r) return;
  r.ingredients.push({name, qty, type, frozen:false});
  render();
  queueSave();
}
function showAddIngForm(rid){
  const f = document.getElementById('add-ing-form-'+rid);
  const b = document.getElementById('add-ing-btn-'+rid);

}
function hideAddIngForm(rid){

function removeStep(rid, idx){
  const r = state.recipes.find(x => x.id === rid);
  if (!r) return;
  r.steps.splice(idx, 1);
  render(); queueSave();
}
function addStep(rid){

function showAddStepForm(rid){

function allIngredientNames(){
  const set = new Map();
  state.recipes.forEach(r => r.ingredients.forEach(i => {
    const key = i.name.toLowerCase();
    if (!set.has(key)) set.set(key, {name:i.name, type:i.type});
  }));
  return Array.from(set.values()).sort((a,b) => a.name.localeCompare(b.name));
}

function renderWhatCanIMake(){
  const allIng = allIngredientNames();
  const filtered = allIng.filter(i => i.name.toLowerCase().includes(pantryFilter.toLowerCase()));

  let html = `<div class="panel-title">What can I make?</div>
  <div class="card">
    <label>Tap the ingredients you currently have on hand</label>
    <input type="text" placeholder="Filter ingredient list…" value="${pantryFilter}"
      oninput="pantryFilter=this.value; render()">
    <div class="ing-chip-grid">
      ${filtered.map(i => `<span class="ing-chip ${pantrySelection.has(i.name)?'on':''}"
        onclick="togglePantry('${i.name.replace(/'/g,"\\'")}')">${i.name}</span>`).join("")}
    </div>
    <div class="pill-toggle" style="margin-top:12px;">
      <button class="${matchMode==='overlap'?'active':''}" onclick="matchMode='overlap'; render()">Best overlap</button>
      <button class="${matchMode==='strict'?'active':''}" onclick="matchMode='strict'; render()">Strict (have everything)</button>
    </div>
    <div class="meal-meta">${pantrySelection.size} ingredient(s) selected. <a href="#" onclick="pantrySelection.clear(); render(); return false;">Clear all</a></div>
  </div>`;

  if (pantrySelection.size === 0){
    html += `<div class="empty">Select a few ingredients above to see matching recipes.</div>`;
    return html;
  }

  const results = state.recipes.map(r => {
    const total = r.ingredients.length;
    const have = r.ingredients.filter(i => pantrySelection.has(i.name)).length;
    return {r, have, total, pct: total ? have/total : 0};
  }).filter(x => x.have > 0);

  let shown = results;
  if (matchMode === "strict"){
    shown = results.filter(x => x.have === x.total);
  }
  shown.sort((a,b) => b.pct - a.pct || b.have - a.have);

  html += `<div class="panel-title" style="margin-top:16px;">Matching recipes</div>`;
  if (shown.length === 0){
    html += `<div class="empty">No recipes match those ingredients${matchMode==='strict' ? ' exactly' : ''}. Try selecting more, or switch to Best overlap.</div>`;
  } else {
    shown.forEach(({r, have, total, pct}) => {
      html += `<div class="card recipe-card">
        <h3>${r.title}</h3>
        <div class="meal-meta">Uses ${have} of ${total} ingredients you have · Serves ${r.servings} · ${r.cuisine}</div>

        <div class="row-actions">
          <button class="primary" onclick="scheduleRecipe('${r.id}')">Schedule this</button>
        </div>
      </div>`;
    });
  }
  return html;
}

/* =========================================================
   RENDER: CALENDAR
   ========================================================= */
function calPrev(){ calMonth--; if(calMonth<0){calMonth=11;calYear--;} render(); }
function calNext(){ calMonth++; if(calMonth>11){calMonth=0;calYear++;} render(); }

function renderCalendar(){
  const today = new Date(); today.setHours(0,0,0,0);
  const todayStr = today.toISOString().slice(0,10);
  const year = calYear, month = calMonth;

  // Index log entries by date
  const byDate = {};
  state.log.forEach(l => {
    if (!byDate[l.date]) byDate[l.date] = [];
    byDate[l.date].push(l);
  });

  const firstDOW = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthLabel = new Date(year, month, 1).toLocaleDateString("en-US",{month:"long",year:"numeric"});
  const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  let html = `<div class="cal-wrap">
    <div class="cal-nav">
      <button onclick="calPrev()">‹</button>
      <span class="cal-nav-title">${monthLabel}</span>
      <button onclick="calNext()">›</button>
    </div>
    <div class="cal-grid">
      ${days.map(d=>`<div class="cal-hdr">${d}</div>`).join("")}`;

  for (let i=0;i<firstDOW;i++) html += `<div class="cal-cell other-month"></div>`;

  for (let day=1; day<=daysInMonth; day++){
    const iso = `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const entries = byDate[iso] || [];
    const isToday = iso === todayStr;
    let cls = "cal-cell";
    if (isToday) cls += " today";
    if (entries.length){
      const s = entries[0].status;
      cls += s==="cooked" ? " has-cooked" : s==="skipped" ? " has-skipped" : " has-planned";
    }
    let inner = `<span class="cal-num${isToday?" today-num":""}">${day}</span>`;
    entries.forEach(l => {
      const r = recipeById(l.recipeId);
      const short = r ? r.title.split(",")[0].split("&")[0].trim().slice(0,20) : "?";
      const mCls = l.status==="cooked" ? "cooked" : l.status==="skipped" ? "skipped" : "";
      inner += `<span class="cal-meal ${mCls}" draggable="true"
        ondragstart="dragStart(event,'${l.id}')"
        ondragend="dragEnd(event)">${short}</span>`;
    });
    html += `<div class="${cls}"
      ondragover="event.preventDefault();this.classList.add('drop-over')"
      ondragleave="this.classList.remove('drop-over')"
      ondrop="dropMealOnDate(event,'${iso}')">${inner}</div>`;
  }

  const trailing = (7 - ((firstDOW + daysInMonth) % 7)) % 7;
  for (let i=0;i<trailing;i++) html += `<div class="cal-cell other-month"></div>`;

  html += `</div></div>`;
  return html;
}

function viewToggleHTML(){
  return `<div class="view-toggle">
    <button class="${!calViewOn?"active":""}" onclick="calViewOn=false;render()">☰ List</button>
    <button class="${calViewOn?"active":""}" onclick="calViewOn=true;render()">⊞ Calendar</button>
  </div>`;
}

/* =========================================================
   RENDER: GROCERY LIST
   ========================================================= */
function renderGroceryList(){
  const today = new Date(); today.setHours(0,0,0,0);
  const upcoming = state.log
    .filter(l => l.status === "planned" && new Date(l.date + "T00:00:00") >= today)
    .sort((a,b) => a.date.localeCompare(b.date))
    .slice(0, groceryDays);

  if (upcoming.length === 0){
    return `<div class="panel-title">Grocery List</div><div class="empty">No upcoming planned meals.</div>`;
  }

  // Aggregate: normalised name → {name, type, frozen, dates:{date:[mealShort,...]}}
  const ingMap = {};
  upcoming.forEach(l => {
    const r = recipeById(l.recipeId);
    if (!r) return;
    const mealShort = r.title.split(",")[0].split("&")[0].trim().slice(0,24);
    r.ingredients.forEach(i => {
      const key = i.name.toLowerCase().trim();
      if (!ingMap[key]) ingMap[key] = {name:i.name, type:i.type||"other", frozen:!!i.frozen, dates:{}};
      if (!ingMap[key].dates[l.date]) ingMap[key].dates[l.date] = [];
      ingMap[key].dates[l.date].push(mealShort);
    });
  });

  // Unique sorted dates
  const dates = [...new Set(upcoming.map(l => l.date))].sort();

  // Sort rows by type then name
  const typeOrder = ["protein","vegetable","fruit","legume","grain","fermented","condiment","other"];
  const typeDotColor = {
    protein:"#b3441f", vegetable:"#3b7a4a", fruit:"#c47a2b", legume:"#7a5c17",
    grain:"#8a7340", fermented:"#6b4a7a", condiment:"#9a9a8a", other:"#9a9a8a"
  };
  const rows = Object.values(ingMap).sort((a,b) => {
    const ta = typeOrder.indexOf(a.type) < 0 ? 99 : typeOrder.indexOf(a.type);
    const tb = typeOrder.indexOf(b.type) < 0 ? 99 : typeOrder.indexOf(b.type);
    return ta !== tb ? ta - tb : a.name.localeCompare(b.name);
  });

  // Header toggles
  const toggles = [7,14].map(n =>
    `<button class="gl-toggle${groceryDays===n?" active":""}" onclick="groceryDays=${n};render()">${n===7?"1 week":"2 weeks"}</button>`
  ).join("") + `<button class="gl-toggle" onclick="groceryChecked.clear();render()">Clear</button>`;

  // Date column headers
  const dateHdrs = dates.map(d => {
    const dt = new Date(d+"T00:00:00");
    const dow = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][dt.getDay()];
    return `<th class="date-hdr">${dow}<br>${dt.getMonth()+1}/${dt.getDate()}</th>`;
  }).join("");

  // Table body
  let tableBody = "";
  let currentType = null;
  rows.forEach(row => {
    if (row.type !== currentType){
      currentType = row.type;
      tableBody += `<tr class="gl-type-sep"><td colspan="${dates.length+1}">${TYPE_LABELS[row.type]||row.type}</td></tr>`;
    }
    const key = row.name.toLowerCase().trim();
    const checked = groceryChecked.has(key);
    const frozenTag = row.frozen ? `<span class="frozen-tag">❄</span>` : "";
    const nameStyle = checked ? "opacity:.35;text-decoration:line-through;" : "";
    const dotCells = dates.map(d => {
      if (!row.dates[d]) return `<td></td>`;
      const tip = row.dates[d].join(" · ").replace(/"/g,"&quot;");
      const color = typeDotColor[row.type] || "#9a9a8a";
      return `<td title="${tip}"><span class="gl-dot" style="background:${color};opacity:${checked?.3:1}"></span></td>`;
    }).join("");
    const safeKey = key.replace(/\\/g,"\\\\").replace(/'/g,"\\'");
    tableBody += `<tr class="gl-row" onclick="toggleGrocery('${safeKey}')">
      <td class="gl-ing-cell" style="${nameStyle}">${row.name}${frozenTag}</td>
      ${dotCells}
    </tr>`;
  });

  const checkedCount = Object.keys(ingMap).filter(k => groceryChecked.has(k)).length;

  return `
    <div class="tab-header">
      <div class="panel-title">Grocery List</div>
      <div class="gl-toggles">${toggles}</div>
    </div>
    <div class="grocery-grid-wrap">
      <table class="grocery-grid">
        <thead><tr><th class="gl-ing-hdr">Ingredient</th>${dateHdrs}</tr></thead>
        <tbody>${tableBody}</tbody>
      </table>
    </div>
    <div class="footer-note">${checkedCount} of ${Object.keys(ingMap).length} unique ingredients checked · tap a row to mark</div>`;
}

function toggleGrocery(key){
  if (groceryChecked.has(key)) groceryChecked.delete(key);
  else groceryChecked.add(key);
  render();
}

/* =========================================================
   SAVE / LOAD
   ========================================================= */
function saveFile(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "dinner-tracker-data.json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function loadFile(){ document.getElementById("fileInput").click(); }
function handleFile(evt){
  const file = evt.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.recipes || !data.log) throw new Error("Missing recipes/log");
      state = data;
      render();
      queueSave();
      alert("Backup imported and synced to the cloud.");
    } catch(err){
      alert("Couldn't read that file: " + err.message);
    }
  };
  reader.readAsText(file);
  evt.target.value = "";
}

/* =========================================================
   MAIN RENDER
   ========================================================= */
function render(){
  // Preserve open <details> across re-render
  const openIds = new Set([...document.querySelectorAll("details[open][id]")].map(d => d.id));
  renderNav();
  const app = document.getElementById("app");
  let body = "";
  if (activeTab === "upcoming") body = renderUpcoming();
  else if (activeTab === "grocerylist") body = renderGroceryList();
  else if (activeTab === "library") body = renderLibrary();
  else if (activeTab === "whatcanimake") body = renderWhatCanIMake();
  else if (activeTab === "history") body = renderHistory();
  else if (activeTab === "addrecipe") body = renderAddRecipe();

  app.innerHTML = `
    ${body}
    <div class="footer-note">Dinner Tracker · synced live via Firebase.</div>`;
  // Reopen any details that were open before re-render
  openIds.forEach(id => { const d = document.getElementById(id); if (d) d.open = true; });
}

/* =========================================================
   CLOUD SYNC — kicks off once Firebase reports a signed-in
   user (see the Firebase module script below). On first ever
   sign-in there's no cloud document yet, so the local seed
   data is pushed up to bootstrap it; after that, this device
   and any other signed-in device stay in sync in real time.
   ========================================================= */
let unsubscribeCloud = null;
let firstSnapshot = true;

function showCloudStatus(message, isError){
  const app = document.getElementById("app");
  if (!app) return;
  const bg = isError ? "#fde8e8" : "var(--card)";
  const fg = isError ? "#7a1f1f" : "var(--muted)";
  app.innerHTML = `<div class="save-banner" style="background:${bg};color:${fg};">${message}</div>`;
}

window.addEventListener("fb-signed-in", () => {
  if (unsubscribeCloud) unsubscribeCloud();
  firstSnapshot = true;
  showCloudStatus("Connecting to your synced data…", false);
  unsubscribeCloud = window.__fb.subscribe(async (data) => {
    if (data && data.recipes && data.log) {
      state = data;
      render();
    } else if (firstSnapshot) {
      // No cloud document yet — bootstrap it with the local seed data.
      try {
        await window.__fb.saveState(state);
        render();
      } catch(err){
        console.error("Bootstrap save failed:", err);
        showCloudStatus("Couldn't create the cloud data document: <strong>" + (err && err.message || err) + "</strong>.<br>In the Firebase console, check that Firestore Database has been created (Firestore Database &rarr; Create database) and that the security rules have been published.", true);
        return;
      }
    }
    firstSnapshot = false;
  }, (err) => {
    showCloudStatus("Couldn't connect to the cloud database: <strong>" + (err && err.message || err) + "</strong>.<br>In the Firebase console, check that Firestore Database has been created and that the security rules have been published (Firestore Database &rarr; Rules).", true);
  });
});

window.addEventListener("fb-signed-out", () => {
  if (unsubscribeCloud) { unsubscribeCloud(); unsubscribeCloud = null; }
});
</script>

/* =========================================================
   FIREBASE AUTH + FIRESTORE
   Real per-user login (only accounts manually added in the

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {

} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, setDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBDqSpm_KROvGwy43VnUUs0ZeEIqfynVbk",
  authDomain: "timvarga-dinner-tracker.firebaseapp.com",
  projectId: "timvarga-dinner-tracker",
  storageBucket: "timvarga-dinner-tracker.firebasestorage.app",

  appId: "1:51796761695:web:21ff52ff3e5c8818618fea"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
const HOUSEHOLD_DOC = doc(db, "household", "shared");

window.__fb = {
  currentUser: null,
  signOutUser(){ return signOut(auth); },
  saveState(state){ return setDoc(HOUSEHOLD_DOC, state); },
  subscribe(onData, onError){
    return onSnapshot(
      HOUSEHOLD_DOC,
      (snap) => onData(snap.exists() ? snap.data() : null),
      (err) => {
        console.error("Firestore listen error:", err);

      }

};

const gate = document.getElementById("authGate");

const form = document.getElementById("gateForm");

const pwInput = document.getElementById("gatePw");

// Meal drag-to-reschedule
let __moveLid = null;

function moveMealToDate(lid, dateStr){
  const l = state.log.find(x => x.id === lid);
  if (!l || l.date === dateStr) return;
  l.date = dateStr;
  render(); queueSave();
}

function buildDragStrip(lid){
  const inner = document.getElementById('drag-strip-inner');
  if (!inner) return;
  const today = new Date(); today.setHours(0,0,0,0);
  const todayStr = today.toISOString().slice(0,10);
  let html = '';
  for (let i = -14; i <= 42; i++){
    const d = new Date(today); d.setDate(d.getDate() + i);
    const ds = d.toISOString().slice(0,10);
    const dn = d.toLocaleDateString('en-US',{weekday:'short'});
    const dm = d.toLocaleDateString('en-US',{month:'short'});
    const isToday = ds === todayStr;
    const occupied = state.log.some(x => x.date === ds && x.id !== lid);
    html += `<div class="strip-cell${isToday?' strip-today':''}${occupied?' strip-occupied':''}" id="sc-${ds}"
      ondragover="event.preventDefault();this.classList.add('drop-over')"
      ondragleave="this.classList.remove('drop-over')"
      ondrop="dropMealOnDate(event,'${ds}')"
      onclick="tapStripDate('${ds}')">
      <span class="sd">${dn}</span>
      <span class="sn">${d.getDate()}</span>
      <span class="sm">${dm}</span>
    </div>`;
  }
  inner.innerHTML = html;
  setTimeout(() => {
    const t = document.getElementById('sc-'+todayStr);
    if (t) t.scrollIntoView({inline:'center',behavior:'instant'});
  }, 20);
}

function dragStart(e, lid){
  __moveLid = lid;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', lid);
  buildDragStrip(lid);
  document.getElementById('drag-strip').style.display = '';
  setTimeout(() => {
    const el = document.getElementById('mc-'+lid);
    if (el) el.classList.add('dragging');
  }, 0);
}

function dragEnd(e){
  if (!__moveLid) return; // already committed by dropMealOnDate
  const el = document.getElementById('mc-'+__moveLid);
  if (el) el.classList.remove('dragging');
  // Keep strip open if in tap/move mode
  if (!el || !el.classList.contains('move-selected')){
    hideDragStrip(); __moveLid = null;
  }
  document.querySelectorAll('.drop-over').forEach(x => x.classList.remove('drop-over'));
}

function dropMealOnDate(e, dateStr){
  e.preventDefault();
  const lid = __moveLid; if (!lid) return;
  document.querySelectorAll('.drop-over').forEach(x => x.classList.remove('drop-over'));
  __moveLid = null;
  hideDragStrip();
  moveMealToDate(lid, dateStr); // calls render() which removes .dragging/.move-selected
}

function enterMoveMode(lid){
  if (__moveLid === lid){ exitMoveMode(); return; } // toggle off
  exitMoveMode();
  __moveLid = lid;
  const el = document.getElementById('mc-'+lid);
  if (el) el.classList.add('move-selected');
  buildDragStrip(lid);
  document.getElementById('drag-strip').style.display = '';
}

function tapStripDate(dateStr){
  if (!__moveLid) return;
  const lid = __moveLid;
  exitMoveMode();
  moveMealToDate(lid, dateStr);
}

function exitMoveMode(){
  if (__moveLid){
    const el = document.getElementById('mc-'+__moveLid);
    if (el) el.classList.remove('move-selected','dragging');
  }
  __moveLid = null;
  hideDragStrip();
}

function hideDragStrip(){
  const s = document.getElementById('drag-strip');
  if (s) s.style.display = 'none';
  document.querySelectorAll('.drop-over').forEach(x => x.classList.remove('drop-over'));
}

// Dismiss move mode when clicking outside a meal card or the strip
document.addEventListener('click', e => {
  if (__moveLid && !e.target.closest('.meal-card, #drag-strip')) exitMoveMode();
});

// Ingredient substitution event wiring
(function(){
  let hoverTimer = null, longTimer = null;
  function ingEl(t){ return t && t.closest && t.closest(".ing-b-name[data-rid]"); }
  document.addEventListener("mouseover", e => {
    const li = ingEl(e.target); if (!li) return;
    clearTimeout(hoverTimer);
    hoverTimer = setTimeout(() => showSubPopup(li, null), 350);
  });
  document.addEventListener("mouseout", e => {
    const li = ingEl(e.target); if (!li) return;
    clearTimeout(hoverTimer);
    hoverTimer = setTimeout(hideSubPopup, 200);
  });
  document.addEventListener("touchstart", e => {
    const li = ingEl(e.target); if (!li) return;
    const touch = e.touches[0];
    longTimer = setTimeout(() => { showSubPopup(li, touch); }, 500);
  }, {passive:true});
  document.addEventListener("touchend",  () => clearTimeout(longTimer), {passive:true});
  document.addEventListener("touchmove", () => clearTimeout(longTimer), {passive:true});
  document.addEventListener("click", e => {
    const p = document.getElementById("ing-sub-popup");
    if (p && !p.contains(e.target) && !ingEl(e.target)) hideSubPopup();
  });
  window.addEventListener("load", () => {
    const p = document.getElementById("ing-sub-popup");
    if (!p) return;
    p.addEventListener("mouseenter", () => clearTimeout(hoverTimer));
    p.addEventListener("mouseleave", () => { hoverTimer = setTimeout(hideSubPopup, 200); });
  });
})();

// Swipe-to-remove for ingredient rows
(function(){
  let swipeStartX = null, swipeRow = null;
  document.addEventListener("touchstart", e => {
    const row = e.target.closest(".ing-b-row");
    if (!row) return;
    swipeStartX = e.touches[0].clientX;
    swipeRow = row;
  }, {passive:true});
  document.addEventListener("touchmove", e => {
    if (swipeStartX === null || !swipeRow) return;
    const dx = swipeStartX - e.touches[0].clientX;
    if (dx > 40) {
      document.querySelectorAll(".ing-b-row.swiped").forEach(r => { if(r!==swipeRow) r.classList.remove("swiped"); });
      swipeRow.classList.add("swiped");
    } else if (dx < -15) {
      swipeRow.classList.remove("swiped");
    }
  }, {passive:true});
  document.addEventListener("touchend", () => { swipeStartX = null; swipeRow = null; }, {passive:true});
  document.addEventListener("click", e => {
    if (!e.target.closest(".ing-b-row")) {
      document.querySelectorAll(".ing-b-row.swiped").forEach(r => r.classList.remove("swiped"));
    }
  });
})();

// Bret Victor–style scrubable numbers
(function(){
  let ss = null; // scrub state
  function scrubEl(t){ return t && t.closest && t.closest(".scrub-num"); }
  function liveScale(el, newVal, ss){
    const rid = ss.rid;
    const r = state.recipes.find(x => x.id === rid);
    if (!r) return;
    const displayScale = ss.type === "headcount"
      ? newVal / r.servings
      : newVal / ss.startVal;
    const card = el.closest(".card") || el.closest("details") || document.body;
    card.querySelectorAll("[data-qty-rid]").forEach(qel => {
      if (qel.dataset.qtyRid !== rid) return;
      const idx = parseInt(qel.dataset.qtyIdx);
      const ing = r.ingredients[idx];
      if (!ing) return;
      const {num, unit} = parseQty(ing.qty);
      qel.textContent = num !== null ? " – " + fmtQty(num * displayScale, unit) : " – " + ing.qty;
    });
  }
  function startScrub(el, clientX){
    ss = {
      el, type: el.dataset.scrub,
      lid: el.dataset.lid, rid: el.dataset.rid,
      startX: clientX,
      startVal: parseInt(el.textContent),
      currentVal: parseInt(el.textContent)
    };
    el.classList.add("scrub-active");
  }
  function moveScrub(clientX){
    if (!ss) return;
    const delta = Math.round((clientX - ss.startX) / 20);
    const nv = Math.max(1, Math.min(12, ss.startVal + delta));
    if (nv === ss.currentVal) return;
    ss.currentVal = nv;
    ss.el.textContent = nv;
    liveScale(ss.el, nv, ss);
  }
  function endScrub(){
    if (!ss) return;
    ss.el.classList.remove("scrub-active");
    const val = ss.currentVal;
    if (val !== ss.startVal) {
      if (ss.type === "headcount") {
        const l = state.log.find(x => x.id === ss.lid);
        if (l) { l.headcount = val; queueSave(); }
      } else {
        const r = state.recipes.find(x => x.id === ss.rid);
        if (r) {
          const scale = val / ss.startVal;
          r.ingredients = r.ingredients.map(i => {
            const {num, unit} = parseQty(i.qty);
            return num !== null ? {...i, qty: fmtQty(num * scale, unit)} : i;
          });
          r.servings = val;
          queueSave();
        }
      }
    }
    ss = null;
  }
  document.addEventListener("mousedown", e => {
    const el = scrubEl(e.target); if (!el) return;
    startScrub(el, e.clientX);
    e.preventDefault();
  });
  document.addEventListener("mousemove", e => { if (ss) moveScrub(e.clientX); });
  document.addEventListener("mouseup", endScrub);
  // Touch: 200ms long-press to activate scrub
  let touchTimer = null, touchActive = false, touchEl = null, touchStartX = 0;
  document.addEventListener("touchstart", e => {
    const el = scrubEl(e.target); if (!el) return;
    touchEl = el; touchStartX = e.touches[0].clientX;
    touchTimer = setTimeout(() => {
      touchActive = true;
      startScrub(el, touchStartX);
    }, 200);
  }, {passive:true});
  document.addEventListener("touchmove", e => {
    if (!touchActive) { clearTimeout(touchTimer); return; }
    moveScrub(e.touches[0].clientX);
  }, {passive:true});
  document.addEventListener("touchend", () => {
    clearTimeout(touchTimer);
    if (touchActive) endScrub();
    touchActive = false; touchEl = null;
  }, {passive:true});
})();

onAuthStateChanged(auth, (user) => {

    gate.style.display = "";

});
